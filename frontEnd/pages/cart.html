<!doctype html>
<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>السلة - نقشة</title>
    <link rel="stylesheet" href="../assets/css/base.css?v=20260511-final" />
    <link rel="stylesheet" href="../assets/css/feedback.css?v=20260511-final" />

</head>
  <body class="cart-page">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="index.html">نقشة</a>

        <button
          class="nav-toggle"
          type="button"
          aria-label="فتح القائمة"
          aria-expanded="false"
          aria-controls="site-nav"
          data-nav-toggle
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span class="sr-only">فتح القائمة</span>
        </button>

        <nav class="nav" id="site-nav" data-nav>
          <a class="active" href="index.html">الرئيسية</a>
          <a href="index.html#men">رجال</a>
          <a href="index.html#women">نساء</a>
          <a href="index.html#kids">أطفال</a>
        </nav>

        <div class="icon-links">
          <a class="icon-btn" href="search.html" aria-label="بحث">⌕</a>
          <a class="icon-btn" href="cart.html" aria-label="السلة">🛒</a>
          <div class="user-menu-wrapper">
            <button id="userMenuButton" class="user-menu-trigger" type="button">
              <span id="userMenuLabel" class="user-menu-name"
                >Ibrahim Awad</span
              >
              <span class="user-menu-icon">👤</span>
            </button>

            <div id="userDropdownMenu" class="user-dropdown-menu d-none">
              <div class="user-dropdown-header">
                <div id="dropdownUserName" class="dropdown-user-name">
                  Ibrahim Awad
                </div>
                <div id="dropdownUserRole" class="dropdown-user-role">
                  مستخدم
                </div>
              </div>

              <a
                href="profile.html"
                id="profileLink"
                class="user-dropdown-item d-none"
              >
                تغيير كلمة السر
              </a>

              <a
                href="admin-dash.html"
                id="adminDashboardLink"
                class="user-dropdown-item d-none"
              >
                لوحة التحكم
              </a>

              <button
                id="logoutButton"
                class="user-dropdown-item logout-item d-none"
                type="button"
              >
                تسجيل الخروج
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="section cart-section" data-cart-page>
      <div class="container">
        <div class="cart-layout">
          <div class="cart-list" data-cart-items></div>

          <aside class="card summary-box">
            <span class="eyebrow">ملخص الطلب</span>
            <h2>تفاصيل الطلب</h2>

            <div class="summary-line">
              <span>المجموع الفرعي</span>
              <strong data-cart-subtotal>0₪</strong>
            </div>
            <div class="summary-line">
              <span>الشحن المتوقع</span>
              <span class="muted" data-cart-shipping
                >يُحسب بعد اختيار الدولة</span
              >
            </div>
            <div class="summary-line">
              <span>الضريبة التقديرية</span>
              <span class="muted" data-cart-tax>0₪</span>
            </div>
            <div class="summary-line total">
              <span>الإجمالي المتوقع</span>
              <strong data-cart-total>0₪</strong>
            </div>

            <a class="btn summary-cta" href="shipping.html">إكمال الشحن</a>
            <a class="summary-link" href="index.html">متابعة التسوق</a>
          </aside>
        </div>
      </div>
    </main>

    <script src="../assets/js/feedback.js?v=20260509-final"></script>
