<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعادة تعيين كلمة السر - نقشة</title>

  <link rel="stylesheet" href="../assets/css/base.css?v=20260509-final" />
  <link rel="stylesheet" href="../assets/css/feedback.css?v=20260509-final" />
  <link rel="stylesheet" href="../assets/css/login.css?v=20260509-final" />
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20260511-mobile" />
</head>

<body class="login-page">
  <main class="login-shell">
<a href="./index.html" class="site-logo" aria-label="Naqsha Store">
  <img src="../assets/images/logo.svg" alt="Naqsha Store" />
</a>
    <section class="card login-card" aria-labelledby="reset-title">
      <header class="login-card-header">
        <h1 id="reset-title">إعادة تعيين كلمة السر</h1>
        <p class="login-subtitle">
          أدخل كلمة سر جديدة لحسابك
        </p>
      </header>

      <form class="login-form" id="reset-password-form">
        <div class="form-group">
          <label for="reset-password">كلمة السر الجديدة</label>

          <div class="login-password-field">
            <input
              id="reset-password"
              type="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
              minlength="6"
              name="password"
              data-password-input
            />

            <button
              class="login-password-toggle"
              type="button"
              aria-label="إظهار كلمة السر"
              aria-pressed="false"
              aria-controls="reset-password"
              data-password-toggle
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.75 12C4.74 8.88 8.07 7 12 7s7.26 1.88 9.25 5c-1.99 3.12-5.32 5-9.25 5S4.74 15.12 2.75 12Z" />
                <circle cx="12" cy="12" r="2.8" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="reset-confirm-password">تأكيد كلمة السر</label>

          <div class="login-password-field">
            <input
              id="reset-confirm-password"
              type="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
              minlength="6"
              name="confirmPassword"
            />
          </div>
        </div>

        <button class="btn login-submit" type="submit" id="reset-submit-btn">
          حفظ كلمة السر الجديدة
        </button>
      </form>

      <div class="login-divider" aria-hidden="true"></div>

      <p class="login-signup">
        تذكرت كلمة السر؟
        <a href="login.html">العودة إلى تسجيل الدخول</a>
      </p>
    </section>
  </main>

  <script src="../assets/js/site.js?v=20260509-final"></script>
    <script src="../assets/js/feedback.js?v=20260509-final"></script>
  <script type="module" src="../assets/js/reset-password.js"></script>
</body>
</html>
