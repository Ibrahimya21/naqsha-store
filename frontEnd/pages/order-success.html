<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تم تأكيد الطلب - نقشة</title>
    <link rel="stylesheet" href="../assets/css/base.css?v=20260509-final" />
    <style>
      .success-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8f7;
        padding: 24px;
      }

      .success-card {
        width: min(560px, 100%);
        background: #fff;
        border: 1px solid #e5ece9;
        border-radius: 28px;
        padding: 36px;
        text-align: center;
        box-shadow: 0 18px 45px rgba(15, 79, 73, 0.08);
      }

      .success-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #d8ece7;
        color: #0f4f49;
        display: grid;
        place-items: center;
        font-size: 2rem;
        font-weight: 900;
      }

      .success-card h1 {
        margin: 0 0 10px;
        color: #14322f;
        font-size: 2rem;
      }

      .success-card p {
        color: #667573;
        line-height: 1.9;
      }

      .order-number {
        margin: 18px auto;
        background: #f5f8f7;
        border: 1px solid #e5ece9;
        border-radius: 18px;
        padding: 14px;
        color: #0f4f49;
        font-weight: 900;
      }

      .success-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 22px;
      }

      .success-actions a {
        text-decoration: none;
      }
    </style>
    <link rel="stylesheet" href="../assets/css/responsive.css?v=20260511-mobile" />
</head>

  <body class="success-page">
    <main class="success-card">
      <div class="success-icon">✓</div>
      <h1>تم إرسال الطلب بنجاح</h1>
      <p>
        تم استلام بيانات الدفع وسيتم مراجعة الإيصال من الإدارة، ثم تأكيد الطلب وتجهيزه.
      </p>

      <div class="order-number" id="orderNumberBox">
        رقم الطلب: جاري التحميل...
      </div>

      <div class="success-actions">
        <a class="btn" href="index.html">العودة للرئيسية</a>
        <a class="btn btn-outline" href="cart.html">السلة</a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const order = params.get("order");
      const box = document.getElementById("orderNumberBox");

      if (order) {
        box.textContent = `رقم الطلب: ${order}`;
      } else {
        box.textContent = "تم إنشاء الطلب";
      }
    </script>
  </body>
</html>
