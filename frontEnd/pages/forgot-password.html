<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نسيت كلمة السر - نقشة</title>

  <link rel="stylesheet" href="../assets/css/base.css?v=20260509-final" />
  <link rel="stylesheet" href="../assets/css/feedback.css?v=20260509-final" />
  <link rel="stylesheet" href="../assets/css/login.css?v=20260509-final" />
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20260511-mobile" />
</head>

<body class="login-page">
  <main class="login-shell">
    <a class="login-logo" href="index.html">نقشة</a>

    <section class="card login-card" aria-labelledby="forgot-title">
      <header class="login-card-header" id="forgotFormHeader">
        <h1 id="forgot-title">نسيت كلمة السر؟</h1>
        <p class="login-subtitle">
          أدخل بريدك الإلكتروني وسنرسل لك تعليمات استعادة كلمة السر
        </p>
      </header>

      <form class="login-form" id="forgot-password-form">
        <div class="form-group">
          <label for="forgot-email">البريد الإلكتروني</label>
          <input
            id="forgot-email"
            type="email"
            placeholder="ادخل بريدك الإلكتروني"
            autocomplete="email"
            required
            name="email"
          />
        </div>

        <button class="btn login-submit" type="submit" id="forgot-submit-btn">
          إرسال رابط الاستعادة
        </button>
      </form>

      <div class="forgot-success d-none" id="forgotSuccessBox">
        <div class="forgot-success-icon">✓</div>

        <h1>تفقد بريدك الإلكتروني</h1>

        <p>
          لقد أرسلنا إليك بريدًا إلكترونيًا يحتوي على تعليمات استعادة كلمة السر.
        </p>

        <p class="forgot-success-email" id="forgotSuccessEmail"></p>

        <a class="btn login-submit" href="login.html">
          العودة إلى تسجيل الدخول
        </a>
      </div>

      <div class="login-divider" aria-hidden="true"></div>

      <p class="login-signup" id="forgotBackLogin">
        تذكرت كلمة السر؟
        <a href="login.html">العودة إلى تسجيل الدخول</a>
      </p>

      <p class="login-signup" id="forgotSignupLink">
        ليس لديك حساب؟
        <a href="signup.html">إنشاء حساب</a>
      </p>
    </section>
  </main>

  <script src="../assets/js/site.js?v=20260509-final"></script>
  <script type="module" src="../assets/js/forgot-password.js"></script>
    <script src="../assets/js/feedback.js?v=20260509-final"></script>
</body>
</html>
